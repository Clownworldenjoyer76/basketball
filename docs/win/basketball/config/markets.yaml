# docs/win/basketball/markets.yaml
# selection_mode:
#   pick_one       = if both sides pass, keep only one
#   all_qualifying = keep every side that passes
# pick_preference:
#   Only matters when selection_mode = pick_one.
#  metric options:
#     ev
#     kelly
#     model_prob
#     edge_vs_market
#   direction options:
#     max
#     min
pick_preference: { metric: model_prob, direction: max }
ml_vs_spread_tiebreak: kelly
markets:
#########################################################################################################################################################
#########################################################################################################################################################
######################################              NBA                                   ###############################################################
#########################################################################################################################################################
#########################################################################################################################################################
  nba:
    moneyline:
      enabled: true
      selection_mode: all_qualifying
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        odds_bands:           [[-100000, 100000]]
        ev_bands:             [[-1.00, 100.00]]
        kelly_bands:          [[0.00, 1.00]]
        model_prob_bands:     [[0.40, 1.0]]

