        line_bands:           [[-100.0, 100.0]]
        odds_bands:           [[-100000, 10000]]
        ev_bands:             [[0.00, 0.0299]]
        kelly_bands:          [[0.00, 1000.0]]
        model_prob_bands:     [[0.00, 0.70]]

###  NCAAM TOTAL  ######################################################################################################################################

    total:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      over:
        enabled: true
        line_bands:           [[0.0, 1000.0]]
        odds_bands:           [[-100000, -110.0]]
        ev_bands:             [[0.075, 1000.0]]
        kelly_bands:          [[0.00, 1000.0]]
        model_prob_bands:     [[0.00, 1.0]]

      under:
        enabled: true
        line_bands:           [[0.0, 139.99], [150.0, 159.99], [165.0, 1000.00]]
