# docs/win/basketball/markets.yaml
# selection_mode:
#   pick_one       = if both sides pass, keep only one
#   all_qualifying = keep every side that passes
# pick_preference:
#   Only matters when selection_mode = pick_one.
#  metric options:
#     ev
#     kelly
#     model_prob
#     edge_vs_market
#   direction options:
#     max
#     min
pick_preference: { metric: model_prob, direction: max }
ml_vs_spread_tiebreak: model_prob
markets:
#########################################################################################################################################################
#########################################################################################################################################################
######################################              NBA                                   ###############################################################
#########################################################################################################################################################
#########################################################################################################################################################
  nba:
    moneyline:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        odds_bands:           [[-100000, 250]]
        ev_bands:             [[0.00, 0.01]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.50, 1.0]]

      away:
        enabled: true
        odds_bands:           [[-100000, 125]]
        ev_bands:             [[0.00, 1000.00]]
        kelly_bands:          [[0.00, 0.20]]
        model_prob_bands:     [[0.50, 0.60], [0.70, 0.80]]

###  NBA SPREAD  #######################################################################################################################################

    spread:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        line_bands:           [[-100.0, 100.0]]
        odds_bands:           [[-110, 100000]]
        ev_bands:             [[0.04, 0.075]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.00, 1.00]]

      away:
        enabled: true
        line_bands:           [[-100.0, 100.0]]
        odds_bands:           [[-110, 100000]]
        ev_bands:             [[0.04, 0.10]]
        kelly_bands:          [[0.00, 0.20]]
        model_prob_bands:     [[0.00, 0.60]]

###  NBA TOTAL  ########################################################################################################################################

    total:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      over:
        enabled: true
        line_bands:           [[0.0, 500.0]]
        odds_bands:           [[-100000, -109]]
        ev_bands:             [[0.00, 0.05]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.00, 1.00]]

      under:
        enabled: true
        line_bands:           [[0.0, 500.0]]
        odds_bands:           [[-100000, -109]]
        ev_bands:             [[0.02, 1000.00]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.60, 1.00]]

#########################################################################################################################################################
#########################################################################################################################################################
######################################              NCAAM                                 ###############################################################
#########################################################################################################################################################
#########################################################################################################################################################

  ncaam:
    # Full valid EV range: EV = probability * decimal_odds - 1 > -1.
    # No negative-EV cutoff was supplied; qualification remains subject to
    # other enabled side filters.
    moneyline:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        odds_bands:           [[-250, 100000]]
        ev_bands:             [[-1.00, 1000.00]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.00, 1.00]]

      away:
        enabled: true
        odds_bands:           [[-200, 100000]]
        ev_bands:             [[-1.00, 1000.00]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.00, 1.00]]

###  NCAAM SPREAD  #####################################################################################################################################

    spread:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        line_bands:           [[-100.0, 100.0]]
        odds_bands:           [[-10000.0, -110.0]]
        ev_bands:             [[-1.00, 1000.00]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.30, 0.3999], [0.60, 1.00]]

      away:
        enabled: true
        line_bands:           [[-100.0, 100.0]]
        odds_bands:           [[-100000.0, -110.0]]
        ev_bands:             [[-1.00, 1000.00]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.60, 1.00]]

###  NCAAM TOTAL  ######################################################################################################################################

    total:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      over:
        enabled: true
        line_bands:           [[0.0, 154.99]]
        odds_bands:           [[-100000, -110.0]]
        ev_bands:             [[-1.00, 1000.00]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.00, 1.00]]

      under:
        enabled: true
        line_bands:           [[0.0, 500.0]]
        odds_bands:           [[-100000, -110.0]]
        ev_bands:             [[-1.00, 0.04]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.00, 1.00]]

#########################################################################################################################################################
#########################################################################################################################################################
######################################              WNBA                                  ###############################################################
#########################################################################################################################################################
#########################################################################################################################################################

  wnba:
    moneyline:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        odds_bands:           [[-100000, 10000]]
        ev_bands:             [[0.00, 1000.00]]
        kelly_bands:          [[0.00, 10000.00]]
        model_prob_bands:     [[0.50, 1.00]]

      away:
        enabled: true
        odds_bands:           [[-100000, 100000]]
        ev_bands:             [[0.01, 1000.00]]
        kelly_bands:          [[0.00, 10000.00]]
        model_prob_bands:     [[0.50, 1.00]]

###  WNBA SPREAD  ######################################################################################################################################

    spread:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        line_bands:           [[-100.0, 100.0]]
        odds_bands:           [[-100000, 100000]]
        ev_bands:             [[0.00, 10000.00]]
        kelly_bands:          [[0.01, 0.0749]]
        model_prob_bands:     [[0.00, 1.00]]

      away:
        enabled: true
        line_bands:           [[-100.0, 100.0]]
        odds_bands:           [[-100000, 100000]]
        ev_bands:             [[0.01, 0.0199], [0.075, 10000.00]]
        kelly_bands:          [[0.00, 1.00]]
        model_prob_bands:     [[0.60, 1.00]]

###  WNBA TOTAL  #######################################################################################################################################

    total:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      over:
        enabled: true
        line_bands:           [[1.0, 500.0]]
        odds_bands:           [[-100000, 100000]]
        ev_bands:             [[0.00, 1000.00]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.90, 1.00]]

      under:
        enabled: true
        line_bands:           [[0.0, 500.0]]
        odds_bands:           [[-100000, 100000]]
        ev_bands:             [[0.00, 1000.00]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.60, 1.00]]

#########################################################################################################################################################
#########################################################################################################################################################
#########################################################################################################################################################
#########################################################################################################################################################

# Per-market:
#
#   selection_mode
#
#     pick_one
#       If both sides qualify, retain only one according to pick_preference.
#
#     all_qualifying
#       Retain every side that passes.
#
#     Development configuration uses:
#       all_qualifying
#
#     This prevents side-selection logic from prematurely removing observations
#     that are useful for model evaluation.
#
#
#   pick_preference.metric
#
#     Supported:
#       ev
#       kelly
#       model_prob
#       edge_vs_market
#
#   pick_preference.direction
#
#     Supported:
#       max
#       min
#
