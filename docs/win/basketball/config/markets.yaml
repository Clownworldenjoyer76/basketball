# docs/win/basketball/markets.yaml
# selection_mode:
#   pick_one       = if both sides pass, keep only one
#   all_qualifying = keep every side that passes
# pick_preference:
#   Only matters when selection_mode = pick_one.
#  metric options:
#     ev
#     kelly
#     model_prob
#     edge_vs_market
#   direction options:
#     max
#     min
pick_preference: { metric: model_prob, direction: max }
ml_vs_spread_tiebreak: model_prob
markets:
#########################################################################################################################################################
#########################################################################################################################################################
######################################              NBA                                   ###############################################################
#########################################################################################################################################################
#########################################################################################################################################################
  nba:
    moneyline:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        odds_bands:           [[-150, 10000]]
        ev_bands:             [[0.00, 1000.0]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.60, 1.0]]

      away:
        enabled: true
        odds_bands:           [[-100000, -100], [149.99, 199.99]]
        ev_bands:             [[0.00, 1000.0]]
        kelly_bands:          [[0.00, 0.20]]
        model_prob_bands:     [[0.50, 1.0]]

###  NBA SPREAD  #######################################################################################################################################

    spread:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        line_bands:           [[-100.0, 100.0]]
        odds_bands:           [[-100000, -110.0]]
        ev_bands:             [[0.00, 1000.0]]
        kelly_bands:          [[0.10, 0.20]]
        model_prob_bands:     [[0.50, 1.0]]

      away:
        enabled: true
        line_bands:           [[-100.0, 100.0]]
        odds_bands:           [[-100000, 10000]]
        ev_bands:             [[0.04, 0.0599]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.50, 1.0]]

###  NBA TOTAL  ########################################################################################################################################

    total:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      over:
        enabled: true
        line_bands:           [[0.0, 214.99], [220.0, 224.99], [230.0, 239.99]]
        odds_bands:           [[-100000, 10000]]
        ev_bands:             [[0.00, 0.0199]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.50, 0.70]]

      under:
        enabled: true
        line_bands:           [[225.0, 1000.0]]
        odds_bands:           [[-100000, 10000]]
        ev_bands:             [[0.00, 1000.0]]
        kelly_bands:          [[0.00, 1000.00]]
        model_prob_bands:     [[0.60, 1.0]]
#########################################################################################################################################################
#########################################################################################################################################################
######################################              NCAAM                                 ###############################################################
#########################################################################################################################################################
#########################################################################################################################################################

  ncaam:
    # Full valid EV range: EV = probability * decimal_odds - 1 > -1.
    # No negative-EV cutoff was supplied; qualification remains subject to
    # other enabled side filters.
    moneyline:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        odds_bands:           [[-100000, 10000]]
        ev_bands:             [[0.01, 0.075]]
        kelly_bands:          [[0.00, 1000.0]]
        model_prob_bands:     [[0.40, 1.0]]

      away:
        enabled: true
        odds_bands:           [[-100000, 10000]]
        ev_bands:             [[0.00, 1000.0]]
        kelly_bands:          [[0.00, 1000.0]]
        model_prob_bands:     [[0.00, 1.0]]

###  NCAAM SPREAD  #####################################################################################################################################

    spread:
      enabled: true
      selection_mode: pick_one
