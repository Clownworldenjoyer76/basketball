# Basketball informational staking / uncertainty configuration
# Fractions are fractions of bankroll: 0.05 = 5%.
# Raw Kelly is a sizing input only; no stake amount filters selected bets.
schema_version: 1
units: fraction_of_bankroll

kelly:
  fractional_multiplier: 0.25

uncertainty_adjustment:
  enabled: true
  method: signal_to_noise_market_shrink
  version: signal_to_noise_market_shrink_v1
  uncertainty_source: model_config_oos_residual_std
  market_std_source:
    moneyline: spread
    spread: spread
    total: total
  ranking_metric: uncertainty_adjusted_ev
  stake_scaling: uncertainty_multiplier

ranking:
  primary: uncertainty_adjusted_ev
  tie_breakers: [raw_ev, raw_kelly]
