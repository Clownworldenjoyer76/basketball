
name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write
      checks: write

    env:
      PYTHONPATH: ${{ github.workspace }}/docs/win/basketball/scripts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/win/basketball/requirements.txt

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          args: --linter qodana-python-community --within-docker false --only-directory docs/win/basketball/scripts
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1571935479 }}
          QODANA_ENDPOINT: https://qodana.cloud
          QODANA_PYTHON_PATH: ${{ steps.python.outputs.python-path }}
