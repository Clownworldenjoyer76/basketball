name: Basketball 01 Pipeline

on:
  workflow_dispatch:
    inputs:
      force_all_leagues:
        description: "Run NBA/NCAAM/WNBA even when a league is operationally offseason"
        required: false
        default: false
        type: boolean
      full_rebuild:
        description: "Rebuild all historical merge/juice/EV/selection outputs (use after model/selection changes)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: basketball-pipeline-${{ github.ref }}
  cancel-in-progress: false

env:
  BASKETBALL_FORCE_ALL_LEAGUES: ${{ inputs.force_all_leagues }}
  BASKETBALL_FULL_REBUILD: ${{ inputs.full_rebuild }}

jobs:
  basketball:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Snapshot all existing basketball error logs before anything in the
      # pipeline can write, append, truncate, or overwrite them.
      #
      # The final daily-status step uses:
      #   - original byte size
      #   - original SHA-256
      #   - a run-start timestamp marker
      #
      # This allows daily_status.txt to report only content generated by
      # THIS workflow run.
      - name: Snapshot basketball error logs
        shell: bash
        run: |
          set -euo pipefail

          ERR_DIR="docs/win/basketball/errors"
          STATUS_FILE="$ERR_DIR/daily_status.txt"
          BASELINE_MANIFEST="/tmp/basketball_error_baseline.tsv"
          RUN_MARKER="/tmp/basketball_run_start"

          mkdir -p "$ERR_DIR"

          : > "$BASELINE_MANIFEST"

          while IFS= read -r -d '' file; do
            SIZE="$(stat -c '%s' "$file")"
            HASH="$(sha256sum "$file" | awk '{print $1}')"

            printf '%s\t%s\t%s\n' \
              "$file" \
              "$SIZE" \
              "$HASH" \
              >> "$BASELINE_MANIFEST"
          done < <(
            find "$ERR_DIR" \
              -type f \
              -name '*.txt' \
              ! -path "$STATUS_FILE" \
              -print0 2>/dev/null | sort -z
          )

          touch "$RUN_MARKER"

          echo "Basketball error-log baseline created."
          echo "Baseline files: $(wc -l < "$BASELINE_MANIFEST" | tr -d ' ')"

      - name: Set date
        run: echo "DATE=$(TZ='America/New_York' date +%Y_%m_%d)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/win/basketball/requirements.txt
          python -m pip install PyYAML
          playwright install-deps chromium
          playwright install chromium

      - name: Ensure output directories
        run: |
          mkdir -p docs/win/basketball/config
          mkdir -p docs/win/basketball/errors/{00_intake,01_merge,03_edges,04_select,05_final_scores}

          for league in nba ncaam wnba; do
            mkdir -p "docs/win/basketball/00_intake/drat_raw/$league"
            mkdir -p "docs/win/basketball/00_intake/predictions/$league"
            mkdir -p "docs/win/basketball/00_intake/predictions_sdv/$league"
            mkdir -p "docs/win/basketball/00_intake/predictions_ensemble/$league"
            mkdir -p "docs/win/basketball/00_intake/sdv/features/current/$league"
            mkdir -p "docs/win/basketball/00_intake/predictions/predictions_cleaned/$league"
            mkdir -p "docs/win/basketball/00_intake/sportsbook/$league"
            mkdir -p "docs/win/basketball/00_intake/sportsbook/sportsbook_cleaned/$league"
            mkdir -p "docs/win/basketball/daily_games/$league"
            mkdir -p "docs/win/basketball/01_merge/$league/moneyline"
            mkdir -p "docs/win/basketball/01_merge/$league/spread"
            mkdir -p "docs/win/basketball/01_merge/$league/total"
            mkdir -p "docs/win/basketball/01_merge/01_merguiced/$league/moneyline"
            mkdir -p "docs/win/basketball/01_merge/01_merguiced/$league/spread"
            mkdir -p "docs/win/basketball/01_merge/01_merguiced/$league/total"
            mkdir -p "docs/win/basketball/03_edges/ev_kelly/$league/moneyline"
            mkdir -p "docs/win/basketball/03_edges/ev_kelly/$league/spread"
            mkdir -p "docs/win/basketball/03_edges/ev_kelly/$league/total"
            mkdir -p "docs/win/basketball/04_select/$league/daily_picks"
            mkdir -p "docs/win/basketball/04_select/$league/locked_picks"
            mkdir -p "docs/win/basketball/05_final_scores/results/$league/graded"
            mkdir -p "docs/win/basketball/05_final_scores/locked_picks/$league"
            mkdir -p "docs/win/basketball/05_final_scores/reports/$league/moneyline"
            mkdir -p "docs/win/basketball/05_final_scores/reports/$league/spread"
            mkdir -p "docs/win/basketball/05_final_scores/reports/$league/total"
            mkdir -p "docs/win/basketball/05_final_scores/reports/$league/overview"
          done

          mkdir -p docs/win/basketball/04_select/daily_slate
          mkdir -p docs/win/basketball/maps/no_map
          mkdir -p docs
          mkdir -p frontend/data/pipeline_health

      # 00 INTAKE
      - name: Run basketball odds
        run: python docs/win/basketball/scripts/00_intake/basketball_odds.py

      - name: Consolidate sportsbook aliases
        run: python docs/win/basketball/scripts/00_intake/consolidate_sportsbook_aliases.py

      - name: Basketball Drat Scraper
        run: python docs/win/basketball/scripts/00_intake/basketball_drat_scraper.py

      - name: Basketball Transform
        run: python docs/win/basketball/scripts/00_intake/transform_basketball.py

      - name: Basketball Name Normalization
        run: python docs/win/basketball/scripts/00_intake/name_normalization.py

      - name: Basketball Daily Games
        run: python docs/win/basketball/scripts/00_intake/basketball_daily_games.py

      - name: Basketball Game ID
        run: python docs/win/basketball/scripts/00_intake/basketball_game_id.py

      - name: SDV Predictions
        shell: bash
        run: |
          set -euo pipefail
          for league in nba ncaam wnba; do
            python docs/win/basketball/scripts/00_intake/sdv_predict.py --league "$league"
          done

      - name: DRatings + SDV Ensemble
        run: python docs/win/basketball/scripts/00_intake/basketball_model_ensemble.py --mode predict

      # Historical NBA opening backfill: do not apply today's rolling bias to prior dates.
      # Guarded: normal incremental runs never create these historical cleaned files.
      - name: Seed NBA opening backfill historical cleaned ensemble
        if: ${{ inputs.full_rebuild }}
        run: python docs/win/basketball/scripts/00_intake/seed_nba_backfill_cleaned.py

      - name: Capture basketball point-in-time source evidence
        run: python docs/win/basketball/scripts/pit_provenance.py --phase capture --date "$DATE"

      - name: Sanitize historical basketball inputs
        run: python docs/win/basketball/scripts/00_intake/sanitize_historical_inputs.py

      - name: Calculate Rolling Bias
        run: python docs/win/basketball/scripts/00_intake/calculate_rolling_bias.py

      - name: Basketball Clean Inputs
        run: python docs/win/basketball/scripts/00_intake/clean_basketball_inputs.py

      - name: Remove unpriced orphan sportsbook placeholders
        run: python docs/win/basketball/scripts/00_intake/cleanup_orphan_sportsbook.py --date "$DATE"

      # 01 MERGE
      - name: Run merge intake
        run: python docs/win/basketball/scripts/01_merge/merge_intake.py

      - name: Run build juice files
        run: python docs/win/basketball/scripts/01_merge/build_juice_files.py

      # 03 EDGES
      - name: Run EV and Kelly
        run: python docs/win/basketball/scripts/03_edges/compute_ev_kelly.py

      # 04 SELECT
      - name: Run basketball bet selection
        run: python docs/win/basketball/scripts/04_select/basketball_select_bets.py

      - name: Audit basketball point-in-time selection evidence
        run: python docs/win/basketball/scripts/pit_provenance.py --phase selection --date "$DATE"

      - name: Run daily slate
        run: python docs/win/basketball/scripts/04_select/daily_slate.py

      # 05 FINAL SCORES / REPORTING
      - name: Fetch basketball final scores
        run: python docs/win/basketball/scripts/05_final_scores/00_basketball_final_scores.py

      - name: Grade basketball results
        run: python docs/win/basketball/scripts/05_final_scores/01_basketball_results_grade.py

      - name: Validate pipeline health
        if: always()
        run: python docs/win/basketball/scripts/pipeline_health.py

      - name: Write WNBA bias drift warning
        if: always()
        run: python docs/win/basketball/scripts/write_wnba_bias_drift_warning.py

      - name: Publish basketball pipeline health data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/data/pipeline_health
          if [ -f docs/win/basketball/pipeline_health.json ]; then
            cp docs/win/basketball/pipeline_health.json frontend/data/pipeline_health/basketball.json
            echo "Published frontend/data/pipeline_health/basketball.json"
          else
            echo "No docs/win/basketball/pipeline_health.json available to publish."
          fi

      - name: Analyze basketball results
        run: python docs/win/basketball/scripts/05_final_scores/02_basketball_results_analyze.py

      - name: Build basketball reports
        run: python docs/win/basketball/scripts/05_final_scores/03_basketball_results_reports.py

      - name: Build basketball dashboard
        run: python docs/win/basketball/scripts/05_final_scores/04_basketball_results_dashboard.py

      # DAILY STATUS
      #
      # Reports only issues generated during THIS workflow run.
      #
      # Operational season dates are loaded from:
      # docs/win/basketball/config/season_dates.yaml
      #
      # Change season start/end dates in that config file only.
      #
      # League-specific issue lines for an offseason league are suppressed.
      # They automatically become reportable again when that league enters
      # its operational season.
      #
      # Existing logs are classified as follows:
      #
      #   UNCHANGED
      #     Same size/hash as workflow start and not touched.
      #     Ignored completely.
      #
      #   APPENDED
      #     File grew and its original byte prefix still exactly matches the
      #     starting file. Only appended bytes are scanned.
      #
      #   REWRITTEN
      #     File shrank, changed in-place, or no longer has the original
      #     contents as its prefix. Entire current file is scanned.
      #
      #   NEW
      #     File did not exist at workflow start. Entire current file is scanned.
      #
      #   TOUCHED_SAME_CONTENT
      #     Same final size/hash but modified after the run marker.
      #     Entire current file is scanned because it was produced/touched
      #     during this run.
      #
      # daily_status.txt itself is always excluded.
      - name: Write daily basketball status
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e

          ERR_DIR="docs/win/basketball/errors"
          STATUS_FILE="$ERR_DIR/daily_status.txt"
          NO_MAP_FILE="docs/win/basketball/maps/no_map/no_map_basketball.csv"
          SEASON_CONFIG="docs/win/basketball/config/season_dates.yaml"

          BASELINE_MANIFEST="/tmp/basketball_error_baseline.tsv"
          RUN_MARKER="/tmp/basketball_run_start"

          mkdir -p "$ERR_DIR"

          TMP_TXT_ISSUES="$(mktemp)"
          TMP_NO_MAP="$(mktemp)"
          TMP_SYSTEM_ISSUES="$(mktemp)"
          TMP_CURRENT_CONTENT="$(mktemp)"
          TMP_MATCHES="$(mktemp)"
          TMP_FILTERED_MATCHES="$(mktemp)"

          trap 'rm -f \
            "$TMP_TXT_ISSUES" \
            "$TMP_NO_MAP" \
            "$TMP_SYSTEM_ISSUES" \
            "$TMP_CURRENT_CONTENT" \
            "$TMP_MATCHES" \
            "$TMP_FILTERED_MATCHES"' EXIT

          : > "$STATUS_FILE"

          TXT_FILES_CHECKED_THIS_RUN=0
          TXT_FILES_WITH_ISSUES=0
          TXT_ISSUE_LINES=0
          TXT_ISSUE_LINES_SUPPRESSED_OFFSEASON=0
          NO_MAP_TEAMS=0
          NO_MAP_TEAMS_SUPPRESSED_OFFSEASON=0
          SYSTEM_ISSUES=0

          JOB_STATUS="${JOB_STATUS:-unknown}"

          NY_MONTH="$(TZ='America/New_York' date +%m)"
          NY_DAY="$(TZ='America/New_York' date +%d)"

          NY_MONTH_NUM=$((10#$NY_MONTH))
          NY_DAY_NUM=$((10#$NY_DAY))
          CURRENT_MMDD=$((NY_MONTH_NUM * 100 + NY_DAY_NUM))

          NBA_SEASON_STATUS="offseason"
          NCAAM_SEASON_STATUS="offseason"
          WNBA_SEASON_STATUS="offseason"

          SEASON_CONFIG_VALID=1

          if [ ! -f "$SEASON_CONFIG" ]; then
            SEASON_CONFIG_VALID=0
            SYSTEM_ISSUES=$((SYSTEM_ISSUES + 1))

            {
              echo "[$SEASON_CONFIG]"
              echo "ERROR: season date config is missing."
              echo ""
            } >> "$TMP_SYSTEM_ISSUES"
          else
            SEASON_VALUES="$(
              python - "$SEASON_CONFIG" <<'PY'
          import sys
          import yaml

          path = sys.argv[1]

          try:
              with open(path, "r", encoding="utf-8") as f:
                  cfg = yaml.safe_load(f) or {}

              values = []

              for league in ("nba", "ncaam", "wnba"):
                  row = cfg.get(league)

                  if not isinstance(row, dict):
                      raise ValueError(f"Missing league config: {league}")

                  start_month = int(row["start_month"])
                  start_day = int(row["start_day"])
                  end_month = int(row["end_month"])
                  end_day = int(row["end_day"])

                  if not 1 <= start_month <= 12:
                      raise ValueError(f"{league}.start_month must be 1-12")
                  if not 1 <= end_month <= 12:
                      raise ValueError(f"{league}.end_month must be 1-12")
                  if not 1 <= start_day <= 31:
                      raise ValueError(f"{league}.start_day must be 1-31")
                  if not 1 <= end_day <= 31:
                      raise ValueError(f"{league}.end_day must be 1-31")

                  values.extend([
                      start_month,
                      start_day,
                      end_month,
                      end_day,
                  ])

              print(*values)

          except Exception as exc:
              print(f"ERROR:{exc}", file=sys.stderr)
              sys.exit(1)
          PY
            )"

            SEASON_CONFIG_RC=$?

            if [ "$SEASON_CONFIG_RC" -ne 0 ]; then
              SEASON_CONFIG_VALID=0
              SYSTEM_ISSUES=$((SYSTEM_ISSUES + 1))

              {
                echo "[$SEASON_CONFIG]"
                echo "ERROR: season date config is invalid."
                echo ""
              } >> "$TMP_SYSTEM_ISSUES"
            else
              read -r \
                NBA_START_MONTH NBA_START_DAY NBA_END_MONTH NBA_END_DAY \
                NCAAM_START_MONTH NCAAM_START_DAY NCAAM_END_MONTH NCAAM_END_DAY \
                WNBA_START_MONTH WNBA_START_DAY WNBA_END_MONTH WNBA_END_DAY \
                <<< "$SEASON_VALUES"
            fi
          fi

          season_is_active() {
            local START_MONTH="$1"
            local START_DAY="$2"
            local END_MONTH="$3"
            local END_DAY="$4"

            local START_MMDD=$((START_MONTH * 100 + START_DAY))
            local END_MMDD=$((END_MONTH * 100 + END_DAY))

            if [ "$START_MMDD" -le "$END_MMDD" ]; then
              [ "$CURRENT_MMDD" -ge "$START_MMDD" ] && \
              [ "$CURRENT_MMDD" -le "$END_MMDD" ]
              return
            fi

            [ "$CURRENT_MMDD" -ge "$START_MMDD" ] || \
            [ "$CURRENT_MMDD" -le "$END_MMDD" ]
          }

          if [ "$SEASON_CONFIG_VALID" -eq 1 ]; then
            if season_is_active \
              "$NBA_START_MONTH" "$NBA_START_DAY" \
              "$NBA_END_MONTH" "$NBA_END_DAY"; then
              NBA_SEASON_STATUS="in_season"
            fi

            if season_is_active \
              "$NCAAM_START_MONTH" "$NCAAM_START_DAY" \
              "$NCAAM_END_MONTH" "$NCAAM_END_DAY"; then
              NCAAM_SEASON_STATUS="in_season"
            fi

            if season_is_active \
              "$WNBA_START_MONTH" "$WNBA_START_DAY" \
              "$WNBA_END_MONTH" "$WNBA_END_DAY"; then
              WNBA_SEASON_STATUS="in_season"
            fi
          fi

          season_status_for_league() {
            case "${1,,}" in
              nba)
                printf '%s\n' "$NBA_SEASON_STATUS"
                ;;
              ncaam)
                printf '%s\n' "$NCAAM_SEASON_STATUS"
                ;;
              wnba)
                printf '%s\n' "$WNBA_SEASON_STATUS"
                ;;
              *)
                printf '%s\n' "unknown"
                ;;
            esac
          }

          line_mentions_league() {
            local TEXT="$1"
            local LEAGUE="$2"

            printf '%s\n' "$TEXT" \
              | grep -Eiq \
                "(^|[^[:alnum:]])${LEAGUE}([^[:alnum:]]|$)"
          }

          should_suppress_offseason_issue() {
            local TEXT="$1"
            local LEAGUE=""
            local STATUS=""
            local FOUND_LEAGUE=0
            local FOUND_IN_SEASON=0

            for LEAGUE in nba ncaam wnba; do
              if line_mentions_league "$TEXT" "$LEAGUE"; then
                FOUND_LEAGUE=1
                STATUS="$(season_status_for_league "$LEAGUE")"

                if [ "$STATUS" != "offseason" ]; then
                  FOUND_IN_SEASON=1
                fi
              fi
            done

            if [ "$FOUND_LEAGUE" -eq 1 ] && \
               [ "$FOUND_IN_SEASON" -eq 0 ]; then
              return 0
            fi

            return 1
          }

          ISSUE_RE='(^[[:space:]]*|[|][[:space:]]*)(WARN(ING)?|ERROR|CRITICAL|FATAL|EXCEPTION|TRACEBACK|FAILED|FAILURE)([[:space:]:|]|$)|STATUS[[:space:]]*:[[:space:]]*(WARNING|WARN|ERROR|FAILED|FAILURE|CRITICAL|FATAL|UNHEALTHY)|WARNINGS?[[:space:]]*[:=][[:space:]]*[1-9][0-9]*|ERRORS?[[:space:]]*[:=][[:space:]]*[1-9][0-9]*|(WARNING|ERROR|FAILED)[[:space:]]*=[[:space:]]*TRUE|^[[:space:]]*[A-Za-z_][A-Za-z0-9_.]*(Error|Exception)[[:space:]]*:'

          declare -A BASE_SIZE
          declare -A BASE_HASH

          BASELINE_AVAILABLE=1

          if [ ! -f "$BASELINE_MANIFEST" ]; then
            BASELINE_AVAILABLE=0
            SYSTEM_ISSUES=$((SYSTEM_ISSUES + 1))

            {
              echo "[DAILY STATUS BASELINE]"
              echo "ERROR: baseline manifest is missing."
              echo "Current-run log changes cannot be safely distinguished from stale log contents."
              echo ""
            } >> "$TMP_SYSTEM_ISSUES"
          else
            while IFS=$'\t' read -r BASE_PATH BASE_BYTES BASE_SHA; do
              [ -n "$BASE_PATH" ] || continue

              BASE_SIZE["$BASE_PATH"]="$BASE_BYTES"
              BASE_HASH["$BASE_PATH"]="$BASE_SHA"
            done < "$BASELINE_MANIFEST"
          fi

          if [ ! -f "$RUN_MARKER" ]; then
            SYSTEM_ISSUES=$((SYSTEM_ISSUES + 1))

            {
              echo "[DAILY STATUS RUN MARKER]"
              echo "ERROR: workflow run-start marker is missing."
              echo ""
            } >> "$TMP_SYSTEM_ISSUES"
          fi

          if [ "$BASELINE_AVAILABLE" -eq 1 ]; then
            while IFS= read -r -d '' file; do
              : > "$TMP_CURRENT_CONTENT"
              : > "$TMP_MATCHES"
              : > "$TMP_FILTERED_MATCHES"

              CURRENT_SIZE="$(stat -c '%s' "$file" 2>/dev/null || echo 0)"
              SCAN_MODE=""
              LINE_OFFSET=0

              if [[ ${BASE_SIZE["$file"]+_} ]]; then
                OLD_SIZE="${BASE_SIZE["$file"]}"
                OLD_HASH="${BASE_HASH["$file"]}"

                if [ "$CURRENT_SIZE" -gt "$OLD_SIZE" ]; then
                  PREFIX_HASH="$(
                    head -c "$OLD_SIZE" "$file" 2>/dev/null \
                      | sha256sum \
                      | awk '{print $1}'
                  )"

                  if [ "$PREFIX_HASH" = "$OLD_HASH" ]; then
                    SCAN_MODE="APPENDED"

                    tail -c "+$((OLD_SIZE + 1))" "$file" \
                      > "$TMP_CURRENT_CONTENT" 2>/dev/null

                    LINE_OFFSET="$(
                      head -c "$OLD_SIZE" "$file" 2>/dev/null \
                        | wc -l \
                        | tr -d ' '
                    )"
                  else
                    SCAN_MODE="REWRITTEN"
                    cat "$file" > "$TMP_CURRENT_CONTENT"
                    LINE_OFFSET=0
                  fi

                elif [ "$CURRENT_SIZE" -lt "$OLD_SIZE" ]; then
                  SCAN_MODE="REWRITTEN"
                  cat "$file" > "$TMP_CURRENT_CONTENT"
                  LINE_OFFSET=0

                else
                  CURRENT_HASH="$(
                    sha256sum "$file" 2>/dev/null \
                      | awk '{print $1}'
                  )"

                  if [ "$CURRENT_HASH" != "$OLD_HASH" ]; then
                    SCAN_MODE="REWRITTEN"
                    cat "$file" > "$TMP_CURRENT_CONTENT"
                    LINE_OFFSET=0

                  elif [ -f "$RUN_MARKER" ] && [ "$file" -nt "$RUN_MARKER" ]; then
                    SCAN_MODE="TOUCHED_SAME_CONTENT"
                    cat "$file" > "$TMP_CURRENT_CONTENT"
                    LINE_OFFSET=0
                  else
                    continue
                  fi
                fi
              else
                SCAN_MODE="NEW"
                cat "$file" > "$TMP_CURRENT_CONTENT"
                LINE_OFFSET=0
              fi

              TXT_FILES_CHECKED_THIS_RUN=$((TXT_FILES_CHECKED_THIS_RUN + 1))

              if [ ! -s "$TMP_CURRENT_CONTENT" ]; then
                continue
              fi

              grep -Ein "$ISSUE_RE" "$TMP_CURRENT_CONTENT" \
                > "$TMP_MATCHES" 2>/dev/null || true

              if [ -s "$TMP_MATCHES" ]; then
                while IFS=: read -r RELATIVE_LINE MESSAGE; do
                  [ -n "$RELATIVE_LINE" ] || continue

                  ISSUE_CONTEXT="$file $MESSAGE"

                  if should_suppress_offseason_issue "$ISSUE_CONTEXT"; then
                    TXT_ISSUE_LINES_SUPPRESSED_OFFSEASON=$((TXT_ISSUE_LINES_SUPPRESSED_OFFSEASON + 1))
                    continue
                  fi

                  printf '%s:%s\n' \
                    "$RELATIVE_LINE" \
                    "$MESSAGE" \
                    >> "$TMP_FILTERED_MATCHES"
                done < "$TMP_MATCHES"
              fi

              if [ -s "$TMP_FILTERED_MATCHES" ]; then
                TXT_FILES_WITH_ISSUES=$((TXT_FILES_WITH_ISSUES + 1))

                MATCH_COUNT="$(
                  wc -l < "$TMP_FILTERED_MATCHES" \
                    | tr -d ' '
                )"

                TXT_ISSUE_LINES=$((TXT_ISSUE_LINES + MATCH_COUNT))

                {
                  echo "[$file]"
                  echo "run_change: $SCAN_MODE"

                  while IFS=: read -r RELATIVE_LINE MESSAGE; do
                    [ -n "$RELATIVE_LINE" ] || continue

                    ORIGINAL_LINE=$((LINE_OFFSET + RELATIVE_LINE))

                    printf '%s:%s\n' \
                      "$ORIGINAL_LINE" \
                      "$MESSAGE"
                  done < "$TMP_FILTERED_MATCHES"

                  echo ""
                } >> "$TMP_TXT_ISSUES"
              fi

            done < <(
              find "$ERR_DIR" \
                -type f \
                -name '*.txt' \
                ! -path "$STATUS_FILE" \
                -print0 2>/dev/null | sort -z
            )
          fi

          if [ ! -f "$NO_MAP_FILE" ]; then
            SYSTEM_ISSUES=$((SYSTEM_ISSUES + 1))

            {
              echo "[$NO_MAP_FILE]"
              echo "ERROR: no-map CSV is missing."
              echo ""
            } >> "$TMP_SYSTEM_ISSUES"
          else
            HEADER="$(head -n 1 "$NO_MAP_FILE" | tr -d '\r')"

            if [ "$HEADER" != "league,team" ]; then
              SYSTEM_ISSUES=$((SYSTEM_ISSUES + 1))

              {
                echo "[$NO_MAP_FILE]"
                echo "ERROR: invalid header."
                echo "Expected: league,team"
                echo "Found: $HEADER"
                echo ""
              } >> "$TMP_SYSTEM_ISSUES"
            fi

            while IFS=',' read -r league team remainder; do
              league="$(
                printf '%s' "$league" \
                  | tr -d '\r' \
                  | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
              )"

              team="$(
                printf '%s' "$team" \
                  | tr -d '\r' \
                  | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
              )"

              [ -n "$league" ] || [ -n "$team" ] || continue

              LEAGUE_LOWER="${league,,}"
              LEAGUE_STATUS="$(season_status_for_league "$LEAGUE_LOWER")"

              if [ "$LEAGUE_STATUS" = "offseason" ]; then
                NO_MAP_TEAMS_SUPPRESSED_OFFSEASON=$((NO_MAP_TEAMS_SUPPRESSED_OFFSEASON + 1))
                continue
              fi

              printf '%s | %s\n' \
                "$league" \
                "$team" \
                >> "$TMP_NO_MAP"

            done < <(tail -n +2 "$NO_MAP_FILE")

            if [ -s "$TMP_NO_MAP" ]; then
              NO_MAP_TEAMS="$(
                wc -l < "$TMP_NO_MAP" \
                  | tr -d ' '
              )"
            fi
          fi

          if [ "$JOB_STATUS" != "success" ]; then
            SYSTEM_ISSUES=$((SYSTEM_ISSUES + 1))

            {
              echo "[GITHUB WORKFLOW]"
              echo "ERROR: workflow status before daily-status generation is $JOB_STATUS."
              echo ""
            } >> "$TMP_SYSTEM_ISSUES"
          fi

          OVERALL="CLEAN"

          if [ "$TXT_FILES_WITH_ISSUES" -gt 0 ] || \
             [ "$NO_MAP_TEAMS" -gt 0 ] || \
             [ "$SYSTEM_ISSUES" -gt 0 ]; then
            OVERALL="ISSUES FOUND"
          fi

          {
            echo "BASKETBALL DAILY STATUS"
            echo "======================="
            echo "generated_at_utc: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "game_date_new_york: ${DATE:-unknown}"
            echo "github_run_id: ${GITHUB_RUN_ID:-unknown}"
            echo "github_run_attempt: ${GITHUB_RUN_ATTEMPT:-unknown}"
            echo "workflow_status: $JOB_STATUS"
            echo ""
            echo "SEASON STATUS"
            echo "-------------"
            echo "nba: $NBA_SEASON_STATUS"
            echo "ncaam: $NCAAM_SEASON_STATUS"
            echo "wnba: $WNBA_SEASON_STATUS"
            echo ""
            echo "SUMMARY"
            echo "-------"
            echo "txt_files_checked_this_run: $TXT_FILES_CHECKED_THIS_RUN"
            echo "txt_files_with_issues: $TXT_FILES_WITH_ISSUES"
            echo "txt_issue_lines: $TXT_ISSUE_LINES"
            echo "txt_issue_lines_suppressed_offseason: $TXT_ISSUE_LINES_SUPPRESSED_OFFSEASON"
            echo "no_map_teams: $NO_MAP_TEAMS"
            echo "no_map_teams_suppressed_offseason: $NO_MAP_TEAMS_SUPPRESSED_OFFSEASON"
            echo "system_issues: $SYSTEM_ISSUES"
            echo "overall: $OVERALL"
            echo ""
            echo "CURRENT-RUN TXT ISSUES"
            echo "----------------------"

            if [ -s "$TMP_TXT_ISSUES" ]; then
              cat "$TMP_TXT_ISSUES"
            else
              echo "None"
              echo ""
            fi

            echo "NO-MAP TEAMS"
            echo "------------"

            if [ -s "$TMP_NO_MAP" ]; then
              cat "$TMP_NO_MAP"
              echo ""
            else
              echo "None"
              echo ""
            fi

            echo "SYSTEM ISSUES"
            echo "-------------"

            if [ -s "$TMP_SYSTEM_ISSUES" ]; then
              cat "$TMP_SYSTEM_ISSUES"
            else
              echo "None"
              echo ""
            fi
          } > "$STATUS_FILE"

          echo "=== Basketball Daily Status ==="
          cat "$STATUS_FILE"

          exit 0

      - name: Show logs
        if: always()
        run: |
          echo "=== Daily Status ==="
          cat docs/win/basketball/errors/daily_status.txt || true
          echo ""
          echo "=== Pipeline Health ==="
          cat docs/win/basketball/errors/pipeline_health.txt || true
          cat docs/win/basketball/pipeline_health.json || true
          echo ""
          echo "=== 00 Intake Logs ==="
          for f in docs/win/basketball/errors/00_intake/*.txt; do
            [ -f "$f" ] && {
              echo "--- $f ---"
              cat "$f"
            } || true
          done
          echo ""
          echo "=== 01 Merge Logs ==="
          for f in docs/win/basketball/errors/01_merge/*.txt; do
            [ -f "$f" ] && {
              echo "--- $f ---"
              cat "$f"
            } || true
          done
          echo ""
          echo "=== 03 Edges Logs ==="
          for f in docs/win/basketball/errors/03_edges/*.txt; do
            [ -f "$f" ] && {
              echo "--- $f ---"
              cat "$f"
            } || true
          done
          echo ""
          echo "=== 04 Select Logs ==="
          for f in docs/win/basketball/errors/04_select/*.txt; do
            [ -f "$f" ] && {
              echo "--- $f ---"
              cat "$f"
            } || true
          done
          echo ""
          echo "=== 05 Final Scores Logs ==="
          for f in docs/win/basketball/errors/05_final_scores/*.txt; do
            [ -f "$f" ] && {
              echo "--- $f ---"
              cat "$f"
            } || true
          done

      - name: Upload basketball point-in-time provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basketball-pit-provenance
          path: docs/win/basketball/pit_audit/runs/
          if-no-files-found: ignore

      - name: Upload basketball logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: basketball-pipeline-logs
          path: docs/win/basketball/errors/

      # Publish only basketball changes onto the latest main commit.
      # Never rebase unrelated commits or overwrite concurrently changed files.
      - name: Commit basketball results
        if: success() || failure()
        shell: bash
        env:
          PIPELINE_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$PIPELINE_STATUS" = "success" ]; then
            git add -A docs/win/basketball
            git add -A frontend/data/dashboards/basketball.json
            git add -A frontend/data/dashboards/nba.json
            git add -A frontend/data/dashboards/ncaam.json
            git add -A frontend/data/dashboards/wnba.json
            git add -A frontend/data/pipeline_health/basketball.json
            COMMIT_MESSAGE="chore: basketball full pipeline $(date -u +'%Y-%m-%d %H:%M UTC')"
          else
            STATUS_FILE="docs/win/basketball/errors/daily_status.txt"
            HEALTH_FILE="docs/win/basketball/pipeline_health.json"
            FRONTEND_HEALTH_FILE="frontend/data/pipeline_health/basketball.json"

            if [ ! -f "$STATUS_FILE" ]; then
              echo "daily_status.txt was not created."
              exit 0
            fi

            git add -- "$STATUS_FILE"
            [ ! -f "$HEALTH_FILE" ] || git add -- "$HEALTH_FILE"
            [ ! -f "$FRONTEND_HEALTH_FILE" ] || git add -- "$FRONTEND_HEALTH_FILE"
            COMMIT_MESSAGE="chore: basketball status failed run $(date -u +'%Y-%m-%d %H:%M UTC')"
          fi

          echo "--- basketball changes selected for commit ---"
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No basketball changes to commit."
            exit 0
          fi

          # Capture exactly the staged content; do not preserve or replay
          # commits from the workflow's old checkout.
          BASE_HEAD="$(git rev-parse HEAD)"
          SNAPSHOT_TREE="$(git write-tree)"
          CHANGED_FILES="$(mktemp)"
          REMOTE_FILES="$(mktemp)"
          trap 'rm -f "$CHANGED_FILES" "$REMOTE_FILES"' EXIT
          git diff --cached --name-only -z > "$CHANGED_FILES"

          # Discard any partial or unstaged outputs. Staged content is safe
          # in SNAPSHOT_TREE, including newly created and deleted files.
          git reset --hard HEAD
          git clean -fd -- docs/win/basketball

          for attempt in 1 2 3; do
            echo "--- publishing basketball changes (attempt $attempt/3) ---"
            git fetch --no-tags --depth=1 origin \
              +refs/heads/main:refs/remotes/origin/main

            # Abort rather than silently overwrite changes made to the
            # same files by another workflow since this run began.
            git diff --name-only -z "$BASE_HEAD" origin/main > "$REMOTE_FILES"
            declare -A REMOTE_CHANGED=()
            while IFS= read -r -d '' path; do
              REMOTE_CHANGED["$path"]=1
            done < "$REMOTE_FILES"

            while IFS= read -r -d '' path; do
              if [[ -v REMOTE_CHANGED["$path"] ]]; then
                echo "::error::File changed on main during this run: $path"
                exit 1
              fi
            done < "$CHANGED_FILES"

            git reset --hard origin/main
            git restore --source="$SNAPSHOT_TREE" --staged --worktree \
              --pathspec-from-file="$CHANGED_FILES" --pathspec-file-nul

            if git diff --cached --quiet; then
              echo "Basketball changes already match origin/main."
              exit 0
            fi

            git commit -m "$COMMIT_MESSAGE"
            if git push origin HEAD:main; then
              echo "Basketball changes published."
              exit 0
            fi

            echo "Push rejected; checking updated main before retry."
          done

          echo "::error::Unable to publish basketball changes after three attempts."
          exit 1
