name: Basketball 02 Grade

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-write-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  basketball-markets-rebuild:
    runs-on: ubuntu-24.04

    env:
      TZ: America/New_York

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            docs/win/basketball
            frontend

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: docs/win/basketball/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/win/basketball/requirements.txt
          python -m pip install PyYAML

      - name: Ensure required directories
        run: |
          mkdir -p docs/win/basketball/errors/04_select
          mkdir -p docs/win/basketball/errors/05_final_scores
          mkdir -p docs/win/basketball/04_select/daily_slate
          mkdir -p docs/win/basketball/05_final_scores
          mkdir -p frontend/data/pipeline_health

      # 1
      - name: Basketball select bets
        env:
          BASKETBALL_FULL_REBUILD: "true"
        run: python docs/win/basketball/scripts/04_select/basketball_select_bets.py

      # 2
      - name: Basketball daily slate
        run: python docs/win/basketball/scripts/04_select/daily_slate.py

      # 3
      - name: Basketball final scores
        run: python docs/win/basketball/scripts/05_final_scores/00_basketball_final_scores.py

      # 4
      - name: Basketball results grade
        run: python docs/win/basketball/scripts/05_final_scores/01_basketball_results_grade.py

      # 5
      - name: Basketball pipeline health
        run: python docs/win/basketball/scripts/pipeline_health.py

      # 6
      - name: WNBA bias drift warning
        run: python docs/win/basketball/scripts/write_wnba_bias_drift_warning.py

      # 7
      - name: Basketball results analyze
        run: python docs/win/basketball/scripts/05_final_scores/02_basketball_results_analyze.py

      # 8
      - name: Basketball results reports
        run: python docs/win/basketball/scripts/05_final_scores/03_basketball_results_reports.py

      # 9
      - name: Basketball results dashboard
        run: python docs/win/basketball/scripts/05_final_scores/04_basketball_results_dashboard.py

      - name: Publish basketball pipeline health
        shell: bash
        run: |
          if [ -f docs/win/basketball/pipeline_health.json ]; then
            cp docs/win/basketball/pipeline_health.json frontend/data/pipeline_health/basketball.json
          fi

      - name: Commit basketball markets rebuild outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A docs/win/basketball/
          git add frontend/data/dashboards/basketball.json
          git add frontend/data/dashboards/nba.json
          git add frontend/data/dashboards/ncaam.json
          git add frontend/data/dashboards/wnba.json
          git add frontend/data/pipeline_health/basketball.json

          echo "--- git status before commit ---"
          git status --short

          if git diff --cached --quiet; then
            echo "No basketball markets rebuild changes to commit."
            exit 0
          fi

          git commit -m "chore: basketball markets rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"

          git pull --rebase --autostash origin main
          git push origin main
